name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
          args: "check --output-format=github"

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.3"
          args: "format --check --diff"
